<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:#14161c; color:#e8eaf0; font-family:system-ui,sans-serif; }
  h1 { margin:0 0 8px; font-size:22px; }
  #hud { margin-bottom:8px; font-size:15px; opacity:.85; }
  canvas { background:#1d212b; border-radius:8px; box-shadow:0 8px 30px #0008; max-width:94vw; touch-action:none; }
  p { opacity:.6; font-size:13px; }
</style>
</head>
<body>
<h1>Snake</h1>
<div id="hud">Score: <b id="score">0</b> · Best: <b id="best">0</b></div>
<canvas id="c" width="400" height="400"></canvas>
<p>Arrow keys / WASD to move (or swipe). Space to start / restart.</p>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const N = 20, S = cv.width / N;
let snake, dir, nextDir, food, score, best = 0, timer, running = false;
try { best = +localStorage.getItem('snakeBest') || 0; } catch(e) {}
document.getElementById('best').textContent = best;

function reset() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = nextDir = {x:1,y:0};
  score = 0; document.getElementById('score').textContent = 0;
  placeFood();
}
function placeFood() {
  do { food = {x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)}; }
  while (snake.some(s => s.x===food.x && s.y===food.y));
}
function start() {
  reset(); running = true;
  clearInterval(timer); timer = setInterval(tick, 110); draw();
}
function gameOver() {
  running = false; clearInterval(timer);
  if (score > best) { best = score; try { localStorage.setItem('snakeBest', best); } catch(e) {}
    document.getElementById('best').textContent = best; }
  draw();
}
function tick() {
  dir = nextDir;
  const h = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (h.x<0||h.y<0||h.x>=N||h.y>=N || snake.some(s=>s.x===h.x&&s.y===h.y)) return gameOver();
  snake.unshift(h);
  if (h.x===food.x && h.y===food.y) {
    score++; document.getElementById('score').textContent = score; placeFood();
  } else snake.pop();
  draw();
}
function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle = '#ff5c6c';
  ctx.beginPath(); ctx.arc(food.x*S+S/2, food.y*S+S/2, S/2-3, 0, 7); ctx.fill();
  snake.forEach((s,i) => {
    ctx.fillStyle = i ? '#4ade80' : '#86efac';
    ctx.fillRect(s.x*S+1, s.y*S+1, S-2, S-2);
  });
  if (!running) {
    ctx.fillStyle = '#000a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 28px system-ui';
    ctx.fillText(score ? 'Game over' : 'Snake', cv.width/2, cv.height/2-10);
    ctx.font = '16px system-ui';
    ctx.fillText('Press Space or tap to play', cv.width/2, cv.height/2+20);
  }
}
function turn(x,y) { if (x !== -dir.x || y !== -dir.y) nextDir = {x,y}; }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k===' ') { e.preventDefault(); if (!running) start(); return; }
  if (k==='arrowup'||k==='w') turn(0,-1);
  else if (k==='arrowdown'||k==='s') turn(0,1);
  else if (k==='arrowleft'||k==='a') turn(-1,0);
  else if (k==='arrowright'||k==='d') turn(1,0);
  if (k.startsWith('arrow')) e.preventDefault();
});
let t0;
cv.addEventListener('pointerdown', e => { t0 = {x:e.clientX,y:e.clientY}; if (!running) start(); });
cv.addEventListener('pointerup', e => {
  if (!t0) return;
  const dx = e.clientX-t0.x, dy = e.clientY-t0.y;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx>0?1:-1,0); else turn(0,dy>0?1:-1);
});
reset(); draw();
</script>
</body>
</html>
